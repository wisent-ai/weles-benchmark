name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  package:
    runs-on: [self-hosted, Linux, X64, stado-precheck]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Compile TypeScript
        run: npm run build
